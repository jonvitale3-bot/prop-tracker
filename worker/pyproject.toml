[project]
name = "prop-tracker-worker"
version = "0.1.0"
description = "Scrapers, parser, and grader for prop-tracker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.scripts]
ingest-reddit  = "prop_tracker.cli:ingest_reddit"
ingest-twitter = "prop_tracker.cli:ingest_twitter"
parse-mentions = "prop_tracker.cli:parse_mentions"
grade-results  = "prop_tracker.cli:grade_results"
migrate        = "prop_tracker.cli:migrate"
worker-loop    = "prop_tracker.cli:worker_loop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prop_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"
